user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format cluster_log '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" upstream: $upstream_addr ($upstream_status) '
                           'time: ${upstream_response_time}s';

    access_log /var/log/nginx/access.log cluster_log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =========================================================================
    # Upstream Backend Pool: FlowOS API cluster across simulated VPS nodes
    # Static IPs inside the private VPS network (10.20.0.0/24)
    # =========================================================================
    upstream flowos_api_cluster {
        # Round-robin load balancing across VPS nodes
        server 10.20.0.11:8080 max_fails=3 fail_timeout=10s; # vps1
        server 10.20.0.12:8080 max_fails=3 fail_timeout=10s; # vps2
        server 10.20.0.13:8080 max_fails=3 fail_timeout=10s; # vps3
        keepalive 32;
    }

    # Upstream Dashboard VPS
    upstream flowos_dashboard_node {
        server 10.20.0.30:3000;
        keepalive 16;
    }

    # Upstream MCP Control Plane VPS
    upstream flowos_mcp_node {
        server 10.20.0.14:8080;
        keepalive 16;
    }

    # =========================================================================
    # Ingress Server 1: Port 80 (Main Entrypoint)
    # Routes /api/ and /health to the FlowOS API cluster
    # Routes / to Dashboard VPS
    # Routes /mcp to MCP VPS
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Virtual VPS Cluster Status & Topology Discovery
        location = /health/cluster {
            default_type application/json;
            add_header Content-Type application/json;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
            return 200 '{\n  "cluster": "FlowOS Virtual Multi-VPS Private Network",\n  "status": "online",\n  "subnet": "10.20.0.0/24",\n  "gateway": "10.20.0.1",\n  "load_balancer": {\n    "name": "vps-lb",\n    "ip": "10.20.0.10",\n    "algorithm": "round_robin",\n    "ingress_ports": [80, 5183, 8080, 8081]\n  },\n  "application_nodes": [\n    {\n      "name": "vps1",\n      "ip": "10.20.0.11",\n      "service": "flowos-api",\n      "internal_port": 8080,\n      "direct_host_port": 5181\n    },\n    {\n      "name": "vps2",\n      "ip": "10.20.0.12",\n      "service": "flowos-api",\n      "internal_port": 8080,\n      "direct_host_port": 5182\n    },\n    {\n      "name": "vps3",\n      "ip": "10.20.0.13",\n      "service": "flowos-api",\n      "internal_port": 8080,\n      "direct_host_port": 5184\n    }\n  ],\n  "database_node": {\n    "name": "vps-db",\n    "ip": "10.20.0.20",\n    "service": "postgresql-15",\n    "internal_port": 5432,\n    "direct_host_port": 5432\n  },\n  "dashboard_node": {\n    "name": "vps-dashboard",\n    "ip": "10.20.0.30",\n    "service": "flowos-dashboard",\n    "internal_port": 3000,\n    "direct_host_port": 3000\n  },\n  "mcp_node": {\n    "name": "vps-mcp",\n    "ip": "10.20.0.14",\n    "service": "flowos-mcp",\n    "internal_port": 8080,\n    "direct_host_port": 8082\n  }\n}\n';
        }

        # Health endpoint from backend cluster
        location /health {
            proxy_pass http://flowos_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Served-By $upstream_addr always;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
        }

        # API Endpoints routed to FlowOS API Cluster
        location /api/ {
            proxy_pass http://flowos_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Server-Sent Events / SSE Streaming
            proxy_buffering off;
            proxy_cache off;

            add_header X-Served-By $upstream_addr always;
            add_header X-Backend-Status $upstream_status always;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
        }

        # MCP Discovery & Transport
        location = /.well-known/mcp {
            proxy_pass http://flowos_mcp_node;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Served-By $upstream_addr always;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
        }

        location = /.well-known/mcp.json {
            proxy_pass http://flowos_mcp_node;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Served-By $upstream_addr always;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
        }

        location /mcp {
            proxy_pass http://flowos_mcp_node;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Served-By $upstream_addr always;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
        }

        # FlowOS Dashboard Web UI
        location / {
            proxy_pass http://flowos_dashboard_node;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Served-By $upstream_addr always;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
        }
    }

    # =========================================================================
    # Ingress Server 2: Port 5183 (FlowOS Standard Port Ingress)
    # Transparently load balances standard FlowOS API traffic across all VPS nodes
    # =========================================================================
    server {
        listen 5183;
        server_name _;

        location / {
            proxy_pass http://flowos_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_cache off;

            add_header X-Served-By $upstream_addr always;
            add_header X-Backend-Status $upstream_status always;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
        }
    }

    # =========================================================================
    # Ingress Server 3: Port 8080 (Alternative API Port Ingress)
    # =========================================================================
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://flowos_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_buffering off;

            add_header X-Served-By $upstream_addr always;
            add_header X-Backend-Status $upstream_status always;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
        }
    }

    # =========================================================================
    # Ingress Server 4: Port 8081 (MCP Ingress)
    # =========================================================================
    server {
        listen 8081;
        server_name _;

        location / {
            proxy_pass http://flowos_mcp_node;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;

            add_header X-Served-By $upstream_addr always;
            add_header X-Load-Balancer "FlowOS-Cluster-LB" always;
        }
    }
}
