server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /llms.txt {
        try_files $uri =404;
        types { }
        default_type text/plain;
    }

    location = /.well-known/mcp {
        try_files /.well-known/mcp =404;
        default_type application/json;
    }

    location = /.well-known/mcp.json {
        try_files /.well-known/mcp.json =404;
        default_type application/json;
    }

    location ~ ^/(terms|privacy|refunds|cancellation|acceptable-use|contact|product|pricing|security|ai-agents|company)/?$ {
        try_files $uri $uri.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
