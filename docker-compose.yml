services:
  flowos-api:
    image: flowos-api
    build:
      context: .
      dockerfile: src/FlowOS.Api/Dockerfile 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=flowos;Username=postgres;Password=password;
    volumes:
      - ./flowos-config:/app/flowos-config
    ports:
      - "5183:8080"
    depends_on:
      - postgres

  flowos-dashboard:
    image: flowos-dashboard
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile 
    command: npm run dev -- --host --port 3000
    environment:
      - VITE_API_TARGET=http://flowos-api:8080
    ports:
      - "3000:3000"
    depends_on:
      - flowos-api

  flowos-mcp:
    image: flowos-mcp
    build:
      context: .
      dockerfile: src/FlowOS.MCP/Dockerfile
    environment:
      - MCP_TRANSPORT=http
      - MCP_API_KEY=${MCP_API_KEY:?MCP_API_KEY is required}
      - MCP_ROLE=${MCP_ROLE:?MCP_ROLE is required}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=flowos;Username=postgres;Password=password;
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=flowos 
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
