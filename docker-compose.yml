services:
  flowos-api:
    image: flowos-api
    build:
      context: .
      dockerfile: src/FlowOS.Api/Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=flowos;Username=postgres;Password=password;
    volumes:
      - ./flowos-config:/app/flowos-config
    depends_on:
      - postgres

  flowos-dashboard:
    image: flowos-dashboard
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    ports:
      - "3000:3000"
    command: npm run dev -- --host --port 3000
    environment:
      - VITE_API_TARGET=http://flowos-api:8080
    depends_on:
      - flowos-api

  flowos-mcp:
    image: flowos-mcp
    build:
      context: .
      dockerfile: src/FlowOS.MCP/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=flowos;Username=postgres;Password=password;
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=flowos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
