version: '3.8'

# FlowOS Sandbox / In-Memory Learning Mode
# Usage: docker compose -f docker-compose.sandbox.yml up --build

services:
  flowos-api-sandbox:
    build:
      context: .
      dockerfile: src/FlowOS.Api/Dockerfile
    container_name: flowos-api-sandbox
    ports:
      - "5183:8080"
    environment:
      - UseInMemoryDatabase=true
      - ASPNETCORE_ENVIRONMENT=Development
      - Sandbox__DataTtlHours=4  # Automatically purges temporary data older than 4 hours (2-6h range)
      - Sandbox__AutoCleanupEnabled=true
      - FLOWOS_HOSTED_LLM_API_KEY=${FLOWOS_HOSTED_LLM_API_KEY:-}
      - FLOWOS_HOSTED_LLM_ENABLED=${FLOWOS_HOSTED_LLM_ENABLED:-true}
      - FLOWOS_HOSTED_LLM_MODEL=${FLOWOS_HOSTED_LLM_MODEL:-gpt-4o-mini}
      - FLOWOS_HOSTED_LLM_MAX_PER_DAY=${FLOWOS_HOSTED_LLM_MAX_PER_DAY:-200}
    restart: unless-stopped

  flowos-mcp-sandbox:
    build:
      context: .
      dockerfile: src/FlowOS.MCP/Dockerfile
    container_name: flowos-mcp-sandbox
    ports:
      - "8081:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_API_KEY=disabled  # Local sandbox: skip API key and billing enforcement
      - FLOWOS_BILLING_ENFORCE=false
      - MCP_ROLE=Admin
      - ASPNETCORE_ENVIRONMENT=Development
      - UseInMemoryDatabase=true
      - FLOWOS_API_URL=http://flowos-api-sandbox:8080
      - FLOWOS_HOSTED_LLM_API_KEY=${FLOWOS_HOSTED_LLM_API_KEY:-}
      - FLOWOS_HOSTED_LLM_ENABLED=${FLOWOS_HOSTED_LLM_ENABLED:-true}
      - FLOWOS_HOSTED_LLM_MODEL=${FLOWOS_HOSTED_LLM_MODEL:-gpt-4o-mini}
      - FLOWOS_HOSTED_LLM_MAX_PER_DAY=${FLOWOS_HOSTED_LLM_MAX_PER_DAY:-200}
    depends_on:
      - flowos-api-sandbox
    restart: unless-stopped
