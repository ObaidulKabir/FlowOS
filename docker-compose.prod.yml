services:
  flowos-api:
    image: flowos-api:1.0.0
    build:
      context: .
      dockerfile: src/FlowOS.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - UseInMemoryDatabase=false
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-flowos_prod};Username=${POSTGRES_USER:-flowos_user};Password=${POSTGRES_PASSWORD:-flowos_secret_password};
    ports:
      - "${API_PORT:-5183}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./flowos-config:/app/flowos-config
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  flowos-mcp:
    image: flowos-mcp:1.0.0
    build:
      context: .
      dockerfile: src/FlowOS.MCP/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MCP_TRANSPORT=http
      - MCP_API_KEY=${MCP_API_KEY:?MCP_API_KEY is required}
      - MCP_ROLE=${MCP_ROLE:-Admin}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-*}
      - ASPNETCORE_URLS=http://+:8080
      - UseInMemoryDatabase=false
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-flowos_prod};Username=${POSTGRES_USER:-flowos_user};Password=${POSTGRES_PASSWORD:-flowos_secret_password};
    ports:
      - "${MCP_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-flowos_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flowos_secret_password}
      - POSTGRES_DB=${POSTGRES_DB:-flowos_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowos_user} -d ${POSTGRES_DB:-flowos_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_prod_data:
