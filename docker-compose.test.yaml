services:
  # ─── FlowOS API ──────────────────────────────────────────────
  flowos-api:
    image: flowos-api
    build:
      context: .
      dockerfile: src/FlowOS.Api/Dockerfile 
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
    volumes:
      - ./flowos-config:/app/flowos-config 
    labels:
      - "traefik.enable=true"
      # Route /api/* to the API service
      - "traefik.http.routers.flowos-api.rule=Host(`${FLOWOS_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.flowos-api.entrypoints=web"
      - "traefik.http.services.flowos-api.loadbalancer.server.port=8080"
    networks:
      - traefik-network
    ports:
      - "5005:8080"   # keep direct access or remove if Traefik is the only ingress

  # ─── FlowOS Dashboard ───────────────────────────────────────
  flowos-dashboard:
    image: flowos-dashboard
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile 
    command: npm run dev -- --host --port 3000
    environment:
      - VITE_API_TARGET=${VITE_API_TARGET}
    depends_on:
      - flowos-api

    labels:
      - "traefik.enable=true"
      # Catch-all for the domain root (lower priority so /api takes precedence)
      - "traefik.http.routers.flowos-dashboard.rule=Host(`${FLOWOS_DOMAIN}`)"
      - "traefik.http.routers.flowos-dashboard.entrypoints=web"
      - "traefik.http.routers.flowos-dashboard.priority=1"
      - "traefik.http.services.flowos-dashboard.loadbalancer.server.port=5173"
    networks:
      - traefik-network 

  # ─── FlowOS MCP (Stdio – no HTTP routing) ───────────────────
  flowos-mcp:
    image: flowos-mcp
    build:
      context: .
      dockerfile: src/FlowOS.MCP/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
    stdin_open: true # docker run -i
    tty: true        # docker run -t 
    labels:
      - "traefik.enable=false"
    networks:
      - traefik-network

  # ─── Expense App Backend ──────────────────────────────────────
  expense-backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./ExpenseApp/backend:/app
    command: sh -c "npm install && npm start"
    environment:
      - EXPENSE_APP_FLOWOS_API_URL=http://flowos-api:8080/api
    ports:
      - "3001:3001"
    networks:
      - traefik-network

  # ─── Expense App Frontend ─────────────────────────────────────
  expense-frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./ExpenseApp/frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_EXPENSE_APP_API_URL=http://localhost:3001
    ports:
      - "3002:3002"
    networks:
      - traefik-network

# ─── Networks ─────────────────────────────────────────────────
networks:
  traefik-network:
    external: true
