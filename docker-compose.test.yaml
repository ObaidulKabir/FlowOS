services:
  # ─── FlowOS API ──────────────────────────────────────────────
  flowos-api:
    image: flowos-api
    build:
      context: .
      dockerfile: src/FlowOS.Api/Dockerfile 
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
    volumes:
      - ./flowos-config:/app/flowos-config 
    labels:
      - "traefik.enable=true"
      # Route /api/* to the API service
      - "traefik.http.routers.flowos-api.rule=Host(`${FLOWOS_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.flowos-api.entrypoints=web"
      - "traefik.http.services.flowos-api.loadbalancer.server.port=8080"
    networks:
      - traefik-network

  # ─── FlowOS Dashboard ───────────────────────────────────────
  flowos-dashboard:
    image: flowos-dashboard
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile 
    command: npm run dev -- --host --port 3000
    environment:
      - VITE_API_TARGET=${VITE_API_TARGET}
    depends_on:
      - flowos-api

    labels:
      - "traefik.enable=true"
      # Catch-all for the domain root (lower priority so /api takes precedence)
      - "traefik.http.routers.flowos-dashboard.rule=Host(`${FLOWOS_DOMAIN}`)"
      - "traefik.http.routers.flowos-dashboard.entrypoints=web"
      - "traefik.http.routers.flowos-dashboard.priority=1"
      - "traefik.http.services.flowos-dashboard.loadbalancer.server.port=3000"
    networks:
      - traefik-network 

  # ─── FlowOS MCP (Streamable HTTP) ───────────────────────────
  flowos-mcp:
    image: flowos-mcp
    build:
      context: .
      dockerfile: src/FlowOS.MCP/Dockerfile
    environment:
      - MCP_TRANSPORT=http
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flowos-mcp.rule=Host(`${FLOWOS_DOMAIN}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.flowos-mcp.entrypoints=web"
      - "traefik.http.services.flowos-mcp.loadbalancer.server.port=8080"
    networks:
      - traefik-network

  # ─── Expense App Backend ──────────────────────────────────────
  expense-backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./ExpenseApp/backend:/app
      - expense-db-data:/app/db
    command: sh -c "npm install && npm start"
    environment:
      - EXPENSE_APP_FLOWOS_API_URL=http://flowos-api:8080/api
 
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      # Catch-all for the domain root (lower priority so /api takes precedence)
      - "traefik.http.routers.expense-backend.rule=Host(`expense-app.gkibria121.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.expense-backend.entrypoints=web" 
      - "traefik.http.services.expense-backend.loadbalancer.server.port=3001"  
  # ─── Expense App Frontend ─────────────────────────────────────
  expense-frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./ExpenseApp/frontend:/app
    command: sh -c "npm install && npm run dev -- --host --port 3002"
    environment:
      - VITE_EXPENSE_APP_API_URL=https://expense-app.gkibria121.com
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      # Catch-all for the domain root (lower priority so /api takes precedence)
      - "traefik.http.routers.expense-frontend.rule=Host(`expense-app.gkibria121.com`)"
      - "traefik.http.routers.expense-frontend.entrypoints=web" 
      - "traefik.http.services.expense-frontend.loadbalancer.server.port=3002"  
# ─── Networks ─────────────────────────────────────────────────
networks:
  traefik-network:
    external: true

volumes:
  expense-db-data:
