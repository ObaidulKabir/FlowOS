name: CI Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FlowOS.sln

      - name: Build
        run: dotnet build FlowOS.sln --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test tests/FlowOS.UnitTests/FlowOS.UnitTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx" --results-directory test-results

      - name: MCP unit tests
        if: success() || failure()
        run: >
          dotnet test tests/FlowOS.MCP.UnitTests/FlowOS.MCP.UnitTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=mcp.trx" --results-directory test-results

      # Testcontainers starts PostgreSQL through the runner's Docker daemon.
      - name: End-to-end tests
        if: success() || failure()
        run: >
          dotnet test tests/FlowOS.EndToEndTests/FlowOS.EndToEndTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=e2e.trx" --results-directory test-results

      - name: Report failed tests
        if: failure()
        run: python3 scripts/report-test-failures.py test-results/*.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/*.trx
          if-no-files-found: warn

  build:
    name: Build API and MCP images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build FlowOS.Api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FlowOS.Api/Dockerfile
          push: false
          tags: flowos-api:ci
          cache-from: type=gha,scope=flowos-api
          cache-to: type=gha,mode=max,scope=flowos-api

      - name: Build FlowOS.MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FlowOS.MCP/Dockerfile
          push: false
          tags: flowos-mcp:ci
          cache-from: type=gha,scope=flowos-mcp
          cache-to: type=gha,mode=max,scope=flowos-mcp
