name: Repository hygiene

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: No logs, databases, archives or scratch files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tracked files
        run: ./scripts/check-repo-hygiene.sh
