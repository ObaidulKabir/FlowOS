name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: string

# One deployment at a time: later merges wait instead of building on the same server in parallel.
concurrency:
  group: deploy-${{ inputs.ENVIRONMENT || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.ENVIRONMENT || 'production' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    environment: ${{ inputs.ENVIRONMENT || 'production' }}
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "SSH connection works"

      - name: Update Code on Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat << 'EOF' > deploy.sh
          set -ex
          
          # Clean up disk space before doing anything else
          # Never prune volumes: a stopped PostgreSQL container's data volume would be deleted.
          docker system prune -af || true
          sudo journalctl --vacuum-time=3d || true
          sudo apt-get clean || true
          
          df -h
          
          mkdir -p "${{ secrets.APP_PATH }}"
          cd "${{ secrets.APP_PATH }}"
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/ObaidulKabir/FlowOS.git
          fi
          git fetch origin
          git reset --hard origin/main
          git clean -fd
          docker network create traefik-network || true
          EOF
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -s" < deploy.sh > deploy_log.txt 2>&1 || (
            echo "SSH COMMAND FAILED. LOG:" > error_body.txt
            cat deploy_log.txt >> error_body.txt
            gh issue create --title "Deploy Failure Log" --body-file error_body.txt --repo ObaidulKabir/FlowOS
            exit 1
          )
          cat deploy_log.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install JWT_SECRET on the server
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "GitHub secret JWT_SECRET is empty."
            echo "Add it under Settings, Secrets and variables, Actions, then rerun this workflow."
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "GitHub secret JWT_SECRET must be at least 32 characters."
            exit 1
          fi
          b64=$(printf '%s' "$JWT_SECRET" | base64 -w0)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "APP_PATH='${{ secrets.APP_PATH }}' JWT_B64='$b64' bash -s" << 'EOF'
          set -eu
          cd "$APP_PATH"
          touch .env
          chmod 600 .env
          tmp=$(mktemp)
          grep -v '^JWT_SECRET=' .env > "$tmp" || true
          secret=$(printf '%s' "$JWT_B64" | base64 -d)
          printf 'JWT_SECRET=%s\n' "$secret" >> "$tmp"
          mv "$tmp" .env
          chmod 600 .env
          unset JWT_B64 secret
          len=$(grep '^JWT_SECRET=' .env | head -n 1 | cut -d= -f2- | tr -d '\r' | wc -c)
          echo "Server JWT_SECRET length: $len"
          test "$len" -ge 32
          EOF
        env:
          GH_TOKEN: ${{ github.token }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Build and Deploy Containers 
        run: |
          cat << 'EOF' > build_deploy.sh
          set -ex
          cd "${{ secrets.APP_PATH }}"
          export FLOWOS_BUILD="$(git rev-list --count HEAD 2>/dev/null || echo ${{ github.run_number }})"
          export VITE_FLOWOS_BUILD="$FLOWOS_BUILD"
          docker builder prune --filter "until=12h" -f
          docker compose -f docker-compose.prod.yml up --build -d
          EOF
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -s" < build_deploy.sh > build_deploy_log.txt 2>&1 || (
            echo "BUILD AND DEPLOY FAILED. LOG:" > build_error_body.txt
            cat build_deploy_log.txt >> build_error_body.txt
            gh issue create --title "Build and Deploy Failure Log" --body-file build_error_body.txt --repo ObaidulKabir/FlowOS
            exit 1
          )
          cat build_deploy_log.txt
        env:
          GH_TOKEN: ${{ github.token }}
