name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.ENVIRONMENT || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT || 'production' }}
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "SSH connection works"

      - name: Update Code on Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat << 'EOF' > deploy.sh
          set -ex
          mkdir -p "${{ secrets.APP_PATH }}"
          cd "${{ secrets.APP_PATH }}"
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/ObaidulKabir/FlowOS.git
          fi
          git fetch origin
          git reset --hard origin/main
          git clean -fd
          docker network create traefik-network || true
          EOF
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -s" < deploy.sh > deploy_log.txt 2>&1 || (cat deploy_log.txt && gh issue create --title "Deploy Failure Log" --body-file deploy_log.txt --repo ObaidulKabir/FlowOS && exit 1)
          cat deploy_log.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and Deploy Containers 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22 
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ secrets.APP_PATH }}
            export FLOWOS_BUILD="$(git rev-list --count HEAD 2>/dev/null || echo ${{ github.run_number }})"
            export VITE_FLOWOS_BUILD="$FLOWOS_BUILD"
            docker builder prune --filter "until=12h" -f
            docker compose -f docker-compose.prod.yml up --build -d
