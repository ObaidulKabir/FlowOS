name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      APP_PATH: ${{ secrets.APP_PATH }}
      BRANCH: ${{ github.ref_name }}
      IS_SELF_HOSTED: ${{ vars.DEPLOY_RUNNER == 'self-hosted' }}

    steps:
      - name: Verify deploy secrets
        env:
          HAS_HOST: ${{ secrets.SSH_HOST != '' }}
          HAS_USER: ${{ secrets.SSH_USER != '' }}
          HAS_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          HAS_PATH: ${{ secrets.APP_PATH != '' }}
          HAS_PORT: ${{ secrets.SSH_PORT != '' }}
        run: |
          set -euo pipefail
          echo "Deploy runner: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}"
          echo "Self-hosted: ${IS_SELF_HOSTED}"
          echo "APP_PATH set: ${HAS_PATH}"
          if [ "${HAS_PATH}" != "true" ]; then
            echo "::error::Production secret APP_PATH is missing."
            exit 1
          fi
          if [ "${IS_SELF_HOSTED}" = "true" ]; then
            echo "SSH secrets are not required on a self-hosted runner."
            exit 0
          fi
          echo "SSH_HOST set: ${HAS_HOST}"
          echo "SSH_USER set: ${HAS_USER}"
          echo "SSH_PRIVATE_KEY set: ${HAS_KEY}"
          echo "SSH_PORT set: ${HAS_PORT} (optional; defaults to 22)"
          if [ "${HAS_HOST}" != "true" ] || [ "${HAS_USER}" != "true" ] || [ "${HAS_KEY}" != "true" ]; then
            echo "::error::Required production secrets are missing. Set SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, and APP_PATH."
            exit 1
          fi

      - name: Deploy on self-hosted runner
        if: env.IS_SELF_HOSTED == 'true'
        run: |
          set -euo pipefail
          echo "[deploy] host: $(hostname)"
          echo "[deploy] user: $(whoami)"
          echo "[deploy] branch: ${BRANCH}"
          echo "[deploy] app path: ${APP_PATH}"

          if [ -z "${APP_PATH}" ] || [ ! -d "${APP_PATH}" ]; then
            echo "::error::Invalid APP_PATH: '${APP_PATH}'"
            exit 1
          fi

          cd "${APP_PATH}"
          echo "[deploy] working dir: $(pwd)"

          if [ ! -d .git ]; then
            echo "::error::APP_PATH is not a git repository: ${APP_PATH}"
            exit 1
          fi

          git config --global --add safe.directory "${APP_PATH}" || true
          git fetch --prune origin

          if ! git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            echo "::error::Remote branch not found: origin/${BRANCH}"
            git branch -a || true
            exit 1
          fi

          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          git reset --hard "origin/${BRANCH}"
          git rev-parse --short HEAD

          docker network create traefik-network || true
          docker compose -f docker-compose.test.yaml up -d --build
          docker compose -f docker-compose.test.yaml ps

      - name: Prepare SSH client
        if: env.IS_SELF_HOSTED != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "${SSH_HOST}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH_USER="$(printf '%s' "${SSH_USER}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH_PORT="$(printf '%s' "${SSH_PORT}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            AddressFamily inet
            ConnectTimeout 20
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 6
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Probe SSH TCP port
        if: env.IS_SELF_HOSTED != 'true'
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          import socket
          import sys
          import urllib.request

          CF_RANGES = [
              "173.245.48.0/20",
              "103.21.244.0/22",
              "103.22.200.0/22",
              "103.31.4.0/22",
              "141.101.64.0/18",
              "108.162.192.0/18",
              "190.93.240.0/20",
              "188.114.96.0/20",
              "197.234.240.0/22",
              "198.41.128.0/17",
              "162.158.0.0/15",
              "104.16.0.0/13",
              "104.24.0.0/14",
              "172.64.0.0/13",
              "131.0.72.0/22",
          ]

          def is_cloudflare(ip: str) -> bool:
              addr = ipaddress.ip_address(ip)
              return any(addr in ipaddress.ip_network(network) for network in CF_RANGES)

          host = (os.environ.get("SSH_HOST") or "").strip().strip('"').strip("'")
          if host.startswith("ssh://"):
              host = host[6:]
          if "@" in host:
              host = host.split("@", 1)[1]
          host = host.split("/")[0]
          if host.count(":") == 1 and not host.startswith("["):
              host = host.split(":", 1)[0]

          port_raw = (os.environ.get("SSH_PORT") or "22").strip() or "22"
          try:
              port = int(port_raw)
          except ValueError:
              print(f"::error::SSH_PORT is not a number: {port_raw!r}")
              sys.exit(1)

          try:
              infos = socket.getaddrinfo(host, port, socket.AF_INET, socket.SOCK_STREAM)
              ips = sorted({item[4][0] for item in infos})
          except Exception as exc:
              print(f"::error::Cannot resolve SSH_HOST {host!r}: {type(exc).__name__}: {exc}")
              sys.exit(1)

          print(f"SSH_HOST={host!r} port={port}")
          print("Resolved IPv4: " + ", ".join(ips))

          cloudflare_ips = [ip for ip in ips if is_cloudflare(ip)]
          if cloudflare_ips:
              print(
                  "::error::SSH_HOST resolves to Cloudflare "
                  f"({', '.join(cloudflare_ips)}). GitHub cannot SSH to a proxied website hostname. "
                  "Set the production SSH_HOST secret to the origin server public IP, "
                  "or to a DNS-only (grey-cloud) hostname."
              )
              sys.exit(1)

          runner_ip = None
          try:
              runner_ip = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode().strip()
              print(f"GitHub runner public IPv4: {runner_ip}")
          except Exception as exc:
              print(f"Could not determine runner public IP: {type(exc).__name__}: {exc}")

          sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          sock.settimeout(15)
          try:
              sock.connect((host, port))
              print("TCP IPv4 connect to SSH port succeeded.")
          except Exception as exc:
              hint = f" Allow inbound IPv4 TCP {port} from GitHub Actions"
              if runner_ip:
                  hint += f" (this runner is {runner_ip})"
              hint += ", or set repository variable DEPLOY_RUNNER=self-hosted and install a runner on the server."
              print(f"::error::TCP IPv4 connect to {host}:{port} failed: {type(exc).__name__}: {exc}.{hint}")
              sys.exit(1)
          finally:
              sock.close()
          PY

      - name: Update Code on Server
        if: env.IS_SELF_HOSTED != 'true'
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes deploy-target "APP_PATH='${APP_PATH}' BRANCH='${BRANCH}' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "[deploy] host: $(hostname)"
          echo "[deploy] user: $(whoami)"
          echo "[deploy] branch: ${BRANCH}"
          echo "[deploy] app path: ${APP_PATH}"

          if [ -z "${APP_PATH}" ] || [ ! -d "${APP_PATH}" ]; then
            echo "Invalid APP_PATH: '${APP_PATH}'"
            exit 1
          fi

          cd "${APP_PATH}"
          echo "[deploy] working dir: $(pwd)"

          if [ ! -d .git ]; then
            echo "APP_PATH is not a git repository: ${APP_PATH}"
            exit 1
          fi

          git config --global --add safe.directory "${APP_PATH}" || true

          echo "[deploy] git version: $(git --version)"
          git remote -v || true
          git status --short --branch || true

          echo "[deploy] fetching branch metadata from origin..."
          git fetch --prune origin

          if ! git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            echo "Remote branch not found: origin/${BRANCH}"
            git branch -a || true
            exit 1
          fi

          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          echo "[deploy] resetting local branch to origin/${BRANCH}..."
          git reset --hard "origin/${BRANCH}"
          git rev-parse --short HEAD
          REMOTE

      - name: Build and Deploy Containers
        if: env.IS_SELF_HOSTED != 'true'
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes deploy-target "APP_PATH='${APP_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "[deploy] host: $(hostname)"
          echo "[deploy] user: $(whoami)"
          echo "[deploy] app path: ${APP_PATH}"
          cd "${APP_PATH}"
          docker network create traefik-network || true
          docker compose -f docker-compose.prod.yaml up -d --build
          docker compose -f docker-compose.prod.yaml ps
          REMOTE
