name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.ENVIRONMENT || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT || 'production' }}
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Update Code on Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd  ${{ secrets.APP_PATH }}
            git fetch origin
            if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git stash push --include-untracked --message "pre-deploy-$(date +%s)" || true
            fi
            git checkout -B main origin/main
            git reset --hard origin/main
            docker network create traefik-network || true

      - name: Build and Deploy Containers 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22 
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ secrets.APP_PATH }}
            export FLOWOS_BUILD="$(git rev-list --count HEAD)"
            export VITE_FLOWOS_BUILD="$FLOWOS_BUILD"
            docker builder prune --filter "until=12h" -f
            docker compose -f docker-compose.prod.yml up --build -d
