name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.ENVIRONMENT || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT || 'production' }}
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "SSH connection works"

      - name: Update Code on Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            exec > /tmp/deploy.log 2>&1
            set -exuo pipefail
            mkdir -p "${{ secrets.APP_PATH }}"
            cd "${{ secrets.APP_PATH }}"
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/ObaidulKabir/FlowOS.git
            fi
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            docker network create traefik-network || true

      - name: Upload Log on Failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            curl -T /tmp/deploy.log https://transfer.sh/flowos_deploy_log_12345.txt

      - name: Build and Deploy Containers 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22 
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ secrets.APP_PATH }}
            export FLOWOS_BUILD="$(git rev-list --count HEAD 2>/dev/null || echo ${{ github.run_number }})"
            export VITE_FLOWOS_BUILD="$FLOWOS_BUILD"
            docker builder prune --filter "until=12h" -f
            docker compose -f docker-compose.prod.yml up --build -d
